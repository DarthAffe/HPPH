name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'version'
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest 

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.0.x
          11.0.x

    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --no-restore --configuration Release /p:Version=${{ github.event.inputs.version }}
      
    - name: Test
      run: dotnet test --no-build --verbosity normal --configuration Release

    - name: List files
      run: tree
      
    - name: Upload Nuget Build Artifact
      uses: actions/upload-artifact@v7.0.2
      with:
        name: HPPH-Nuget
        path: bin\*.nupkg
        if-no-files-found: error

    - name: Pack Release Assets
      run: |
        Compress-Archive -Path bin/net10.0/*.dll -DestinationPath HPPH-net10.0.zip
        Compress-Archive -Path bin/net11.0/*.dll -DestinationPath HPPH-net11.0.zip

    - name: Release
      uses: softprops/action-gh-release@v3.0.4
      with:
        tag_name: ${{ github.event.inputs.version }}
        generate_release_notes: true
        files: HPPH-*.zip
 
    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
 
    - name: Nuget Push
      run: dotnet nuget push **\*.nupkg --skip-duplicate --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
      
    - name: Symbols Push
      run: dotnet nuget push **\*.snupkg --skip-duplicate --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
     
